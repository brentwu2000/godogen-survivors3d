; Export presets, written by hand rather than by the editor.
;
; The Android toolchain is not installed on the machine this was developed on —
; no SDK, no JDK, and the only export template present is 4.6.3 against a 4.7.1
; project. That blocks *building* an APK and it does not block deciding what the
; APK should be, so the decisions are here: arm64 only, landscape locked,
; gles3-class mobile renderer, and no permissions at all.
;
; With the three prerequisites installed this is one command:
;
;   godot --headless --export-debug "Android" build/survivors3d.apk
;
; Untested on a device. Said plainly because a preset that has never produced an
; APK is a plan, not a build.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""

; The art sources are 33 MB of PNGs that nothing at runtime reads — the fitted
; sprites under assets/ are what the game loads. Excluding them is most of the
; difference between a reasonable download and a silly one.
exclude_filter="art-src/*, screenshots/*, test/*"

export_path="build/survivors3d.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=false

; 64-bit only. Google Play has required it since 2019 and a 32-bit slice is
; several megabytes of library nothing will run.
architectures/arm64-v8a=true
architectures/x86=false

; Left on for the emulator, which is the only way to see this run at all until
; a device is available.
architectures/x86_64=true

version/code=1
version/name="0.1.0"
package/unique_name="com.brentwu.survivors3d"
package/name="Survivors3D"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false

launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
launcher_icons/adaptive_monochrome_432x432=""

graphics/opengl_debug=false

; The touch layer built in Phase 17 is a stick on the left half and four buttons
; in an arc bottom-right, laid out for a landscape screen. A build that let the
; device rotate would put the stick under the player's palm.
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true

user_data_backup/allow=false

command_line/extra_args=""

apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""

; None. The game writes one JSON file to user:// and talks to nothing — an
; Android permission prompt for a single-player game with no network is a prompt
; the player is right to be suspicious of.
permissions/custom_permissions=PackedStringArray()
