Microsoft Visual Studio Solution File, Format Version 12.00
# In the repository for one reason: Godot's .NET export step wants a solution.
#
# Nothing else here uses it. Every build in this project is `dotnet build`
# against the .csproj directly, and that works with no solution at all.
#
# Without this file the export prints an error per C# file and then **finishes
# with exit code 0**, producing an .exe and a .pck that launch, render, and
# contain no game. A green export is not evidence of an exported assembly; the
# evidence is `Survivors3D.dll` in `data_Survivors3D_windows_x86_64/`, which is
# what `export.ps1` checks.
Project("{9A19103F-16F7-4668-BE54-9A1E7A4F7556}") = "Survivors3D", "Survivors3D.csproj", "{6F0F2B6E-9A79-4E62-9C46-4C1B7B1B23A1}"
EndProject
Global
	GlobalSection(SolutionConfigurationPlatforms) = preSolution
		Debug|Any CPU = Debug|Any CPU
		ExportDebug|Any CPU = ExportDebug|Any CPU
		ExportRelease|Any CPU = ExportRelease|Any CPU
	EndGlobalSection
	GlobalSection(ProjectConfigurationPlatforms) = postSolution
		{6F0F2B6E-9A79-4E62-9C46-4C1B7B1B23A1}.Debug|Any CPU.ActiveCfg = Debug|Any CPU
		{6F0F2B6E-9A79-4E62-9C46-4C1B7B1B23A1}.Debug|Any CPU.Build.0 = Debug|Any CPU
		{6F0F2B6E-9A79-4E62-9C46-4C1B7B1B23A1}.ExportDebug|Any CPU.ActiveCfg = ExportDebug|Any CPU
		{6F0F2B6E-9A79-4E62-9C46-4C1B7B1B23A1}.ExportDebug|Any CPU.Build.0 = ExportDebug|Any CPU
		{6F0F2B6E-9A79-4E62-9C46-4C1B7B1B23A1}.ExportRelease|Any CPU.ActiveCfg = ExportRelease|Any CPU
		{6F0F2B6E-9A79-4E62-9C46-4C1B7B1B23A1}.ExportRelease|Any CPU.Build.0 = ExportRelease|Any CPU
	EndGlobalSection
	GlobalSection(SolutionProperties) = preSolution
		HideSolutionNode = FALSE
	EndGlobalSection
EndGlobal
